name: Lint

# Reads the code for mistakes a reader overlooks: unused names, a swallowed
# exception, a blocking call in async code, outdated spellings. The rules are
# in pyproject.toml ([tool.ruff]). No formatting rules.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Check
        run: python -m ruff check .

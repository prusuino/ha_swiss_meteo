.condition_common_fields: &condition_common_fields
  behavior:
    required: true
    default: any
    selector:
      automation_behavior:
        mode: condition
  for:
    required: true
    default: 00:00:00
    selector:
      duration:

.rain_target: &rain_target
  entity:
    - integration: swiss_meteo
      domain: binary_sensor
      device_class: moisture

is_rain_expected:
  fields: *condition_common_fields
  target: *rain_target

is_dry:
  fields: *condition_common_fields
  target: *rain_target

is_frost_expected:
  fields: *condition_common_fields
  target:
    entity:
      - integration: swiss_meteo
        domain: binary_sensor
        device_class: cold
